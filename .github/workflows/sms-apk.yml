name: SMS APK

on:
  push:
    paths:
      - "sms-uygulamasi/**"
      - ".github/workflows/sms-apk.yml"
  pull_request:
    paths:
      - "sms-uygulamasi/**"
      - ".github/workflows/sms-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-uygulamasi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cift-sim-mesajlar-debug
          path: sms-uygulamasi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
